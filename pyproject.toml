[project]
name = "ffmpeg-engine"
version = "0.1.0"
description = "HTTP service that renders videos using ffmpeg via moviepy"
authors = ["Generated by ChatGPT"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "moviepy>=1.0.3",
    "ffmpeg-python>=0.2.0",
    "pydantic>=1.10",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["black", "isort", "mypy"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

