services:
  ffmpeg-engine:
    build:
      context: .
      dockerfile: Dockerfile
    gpus: all
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - FFMPEG_USE_GPU=${FFMPEG_USE_GPU:-0}
      - FFMPEG_GPU_PRESET=${FFMPEG_GPU_PRESET:-p4}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
      # Host absolute path remapping for JSON source paths (optional).
      # Format: SRC_PREFIX=DST_PREFIX;SRC2=DST2
      - MEDIA_PATH_MAPPINGS=${MEDIA_PATH_MAPPINGS:-}
    volumes:
      # Mount source code so changes on host are visible in container.
      - ./:/app
      - ./media:/app/media:ro
      # Optional extra host media root for absolute-path mapping.
      - ${EXTRA_MEDIA_HOST_PATH:-./media}:${EXTRA_MEDIA_CONTAINER_PATH:-/external_media}:ro
      - ./renders:/app/renders
