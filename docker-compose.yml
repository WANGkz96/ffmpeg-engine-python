services:
  ffmpeg-engine:
    build:
      context: .
      dockerfile: Dockerfile
    gpus: all
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - FFMPEG_USE_GPU=${FFMPEG_USE_GPU:-0}
      - FFMPEG_GPU_PRESET=${FFMPEG_GPU_PRESET:-p4}
      - FFMPEG_RENDER_FAST_PATH=${FFMPEG_RENDER_FAST_PATH:-0}
      - FFMPEG_RENDER_FAST_PATH_STRICT=${FFMPEG_RENDER_FAST_PATH_STRICT:-0}
      - FFMPEG_RENDER_APPROXIMATE_TRANSITIONS=${FFMPEG_RENDER_APPROXIMATE_TRANSITIONS:-0}
      - FFMPEG_FAST_RENDER_NORMALIZE_CONCURRENCY=${FFMPEG_FAST_RENDER_NORMALIZE_CONCURRENCY:-4}
      - FFMPEG_COMMAND_TIMEOUT_SECONDS=${FFMPEG_COMMAND_TIMEOUT_SECONDS:-0}
      - CANCEL_RENDER_ON_CLIENT_DISCONNECT=${CANCEL_RENDER_ON_CLIENT_DISCONNECT:-false}
      # One render can already open four NVENC normalization sessions.
      # Serializing render jobs keeps the GPU encoder session cap bounded.
      - RENDER_MODE_CONCURRENCY=${RENDER_MODE_CONCURRENCY:-1}
      - CONCAT_NORMALIZE_CONCURRENCY=${CONCAT_NORMALIZE_CONCURRENCY:-1}
      - EDITOR_PROXY_MODE_CONCURRENCY=${EDITOR_PROXY_MODE_CONCURRENCY:-2}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-8}
      - FFMPEG_FILTER_THREADS=${FFMPEG_FILTER_THREADS:-8}
      - FFMPEG_FILTER_COMPLEX_THREADS=${FFMPEG_FILTER_COMPLEX_THREADS:-4}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
      # Directories scanned when resolving texts[].font by installed font name.
      - FFMPEG_FONT_DIRS=${FFMPEG_FONT_DIRS:-/system_fonts/windows:/system_fonts/windows_user:/usr/share/fonts:/usr/local/share/fonts}
      # Host absolute path remapping for JSON source paths (optional).
      # Format: SRC_PREFIX=DST_PREFIX;SRC2=DST2
      - MEDIA_PATH_MAPPINGS=${MEDIA_PATH_MAPPINGS:-}
    volumes:
      # Mount source code so changes on host are visible in container.
      - ./:/app
      - ./media:/app/media
      # Windows system fonts, read-only. Override SYSTEM_FONTS_HOST_PATH if needed.
      - ${SYSTEM_FONTS_HOST_PATH:-C:/Windows/Fonts}:/system_fonts/windows:ro
      # Per-user Windows fonts, read-only. Override USER_FONTS_HOST_PATH if needed.
      - ${USER_FONTS_HOST_PATH:-${LOCALAPPDATA}/Microsoft/Windows/Fonts}:/system_fonts/windows_user:ro
      # Optional extra host media root for absolute-path mapping.
      - ${EXTRA_MEDIA_HOST_PATH:-../../Video-pipeline/Video-pipeline/server/data/pipeline/STEP_3_MEDIA}:${EXTRA_MEDIA_CONTAINER_PATH:-/external_media}:ro
      - ./renders:/app/renders
